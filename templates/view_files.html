{% extends 'base.html' %}
{% block content %}
<h2>Your Uploaded Files</h2>
{% if files %}
    <ul class="list-group">
        {% for file in files %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ file.filename }}</span>
                <span>
                    <a href="{{ url_for('download', file_id=file.id) }}" class="btn btn-sm btn-success">Download</a>
                    <form method="POST" action="{{ url_for('delete', file_id=file.id) }}" style="display:inline;">
                        <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                    </form>
                </span>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No files uploaded yet.</p>
{% endif %}
<a href="{{ url_for('dashboard') }}" class="btn btn-link mt-3">Back to Dashboard</a>
{% endblock %}
